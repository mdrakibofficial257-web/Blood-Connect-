<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Nangalkot Blood Connect — নাঙ্গলকোট ব্লাড কানেক্ট</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F8F7;--surface:#FFFFFF;--ink:#12211F;--muted:#586A66;--line:#D8E3E0;
  --brand:#14615B;--brand-ink:#FFFFFF;--brand-soft:#E2F0ED;
  --blood:#B42318;--blood-soft:#FCEBE8;--amber:#8F5F00;--amber-soft:#FFF1CF;--ok:#1B7548;--ok-soft:#E0F3E9;--grey-soft:#EAEFEE;
  --focus:#0B57D0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1513;--surface:#15211E;--ink:#E8F0EE;--muted:#9DB0AC;--line:#27383A;
    --brand:#5CC2B4;--brand-ink:#06201C;--brand-soft:#17332F;
    --blood:#F28B80;--blood-soft:#3A1B18;--amber:#E6B35A;--amber-soft:#3A2E14;--ok:#6BD09A;--ok-soft:#173325;--grey-soft:#1E2C29;--focus:#8AB4F8;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1513;--surface:#15211E;--ink:#E8F0EE;--muted:#9DB0AC;--line:#27383A;
  --brand:#5CC2B4;--brand-ink:#06201C;--brand-soft:#17332F;
  --blood:#F28B80;--blood-soft:#3A1B18;--amber:#E6B35A;--amber-soft:#3A2E14;--ok:#6BD09A;--ok-soft:#173325;--grey-soft:#1E2C29;--focus:#8AB4F8;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.75 "Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
h1,h2,h3{font-family:"Noto Serif Bengali","Hind Siliguri",Georgia,serif;line-height:1.45;margin:0 0 .5rem;font-weight:700}
h1{font-size:clamp(1.6rem,5.5vw,2.3rem)}h2{font-size:clamp(1.3rem,4vw,1.65rem)}h3{font-size:1.1rem}
p{margin:0 0 .75rem}a{color:var(--brand);text-underline-offset:3px}
.muted{color:var(--muted)}.small{font-size:.875rem}.center{text-align:center}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:0;background:var(--brand);color:var(--brand-ink);padding:.5rem 1rem;z-index:100}.skip:focus{left:8px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;line-height:1.2}
.brand svg{width:30px;height:30px;flex:none;fill:var(--blood)}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}
.tnav{display:none;margin-left:auto;gap:4px}
.tnav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:500}
.tnav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.spacer{flex:1}
.langbtn{min-height:40px;padding:0 14px;border:1.5px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.demo{background:var(--amber-soft);color:var(--amber);font-size:.82rem;padding:6px 0;line-height:1.5}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:500;line-height:1.2}
.bnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav a[aria-current="page"]{color:var(--brand);font-weight:700}
main{padding:20px 0 96px}
@media (min-width:760px){.bnav{display:none}.tnav{display:flex}main{padding-bottom:48px}.spacer{display:none}}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:12px;border:1.5px solid transparent;font:inherit;font-weight:600;text-decoration:none;cursor:pointer;line-height:1.2;text-align:center}
.btn-p{background:var(--brand);color:var(--brand-ink)}
.btn-o{background:transparent;border-color:var(--brand);color:var(--brand)}
.btn-d{background:var(--blood);color:#fff}
.btn-g{background:var(--grey-soft);color:var(--ink)}
.btn-s{min-height:42px;padding:0 14px;font-size:.9rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px}.row>*{flex:1 1 220px}.row.auto>*{flex:0 0 auto}
.stack>*+*{margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.sec{margin-top:36px}
.sec>h2{margin-bottom:14px}
.ph{margin-bottom:18px}

/* fields */
.field{margin-bottom:14px}
label,.lbl{display:block;font-weight:600;margin-bottom:4px}
input[type=text],input[type=tel],input[type=password],input[type=date],input[type=number],input[type=datetime-local],select,textarea{width:100%;min-height:50px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
textarea{min-height:96px;resize:vertical}
input[type=file]{width:100%;font:inherit}
.hint{font-size:.83rem;color:var(--muted);margin:4px 0 0}
.err{font-size:.85rem;color:var(--blood);margin:4px 0 0;min-height:0}
.err:empty{display:none}
input.bad,select.bad,textarea.bad{border-color:var(--blood)}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-bottom:10px}
.chk input{width:22px;height:22px;flex:none;margin-top:4px;accent-color:var(--brand)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.two{display:grid;gap:0 12px;grid-template-columns:1fr}
@media (min-width:560px){.two{grid-template-columns:1fr 1fr}}
fieldset{border:0;padding:0;margin:0 0 14px}
legend{font-weight:600;padding:0;margin-bottom:6px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;min-width:56px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;font-family:"Noto Serif Bengali",Georgia,serif}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* pills/badges */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600;line-height:1.6;background:var(--grey-soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--amber-soft);color:var(--amber)}.pill.bad{background:var(--blood-soft);color:var(--blood)}.pill.brand{background:var(--brand-soft);color:var(--brand)}
.bg{display:inline-flex;align-items:center;justify-content:center;min-width:54px;height:54px;padding:0 8px;border-radius:14px;background:var(--blood-soft);color:var(--blood);font:700 1.35rem/1 "Noto Serif Bengali",Georgia,serif;flex:none}
.bg.sm{min-width:40px;height:40px;font-size:1rem;border-radius:10px}
.bg.lg{min-width:84px;height:84px;font-size:2.1rem;border-radius:20px}
.av{width:54px;height:54px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:1.3rem;flex:none;object-fit:cover}

/* hero */
.hero{background:var(--brand-soft);border-radius:24px;padding:24px 18px}
.hero .tag{color:var(--brand);font-weight:600;margin-bottom:6px}
.hero h1{font-size:clamp(2.2rem,9vw,3.6rem);line-height:1.25;margin-bottom:10px}
.hero .lead{font-size:1.06rem;max-width:34em}
.hero .row{margin:18px 0 22px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:78px;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;color:var(--ink);font:inherit;cursor:pointer;padding:6px 2px}
.tile b{font:700 1.55rem/1.2 "Noto Serif Bengali",Georgia,serif;color:var(--blood)}
.tile span{font-size:.74rem;color:var(--muted);line-height:1.3}
@media (min-width:760px){.hero{padding:40px 40px 34px}.tiles{gap:12px;max-width:640px}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.stats>div{padding:14px 8px;text-align:center}.stats>div+div{border-left:1px solid var(--line)}
.stats b{display:block;font:700 clamp(1.5rem,6vw,2.1rem)/1.3 "Noto Serif Bengali",Georgia,serif;color:var(--brand)}
.stats span{font-size:.82rem;color:var(--muted);line-height:1.4;display:block}

/* bars */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px}
.bar b{font-family:"Noto Serif Bengali",Georgia,serif;color:var(--blood)}
.bar .tr{height:12px;background:var(--grey-soft);border-radius:99px;overflow:hidden}
.bar .fl{height:100%;background:var(--brand);border-radius:99px}
.bar span{font-size:.85rem;color:var(--muted);min-width:70px;text-align:right}

/* donor + request cards */
.dc{display:grid;gap:12px}
.dc .top2{display:flex;gap:12px;align-items:center}
.dc h3{margin:0;font-family:"Hind Siliguri",sans-serif}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem;color:var(--muted)}
.rq{border-left:6px solid var(--brand);display:grid;gap:10px}
.rq.critical{border-left-color:var(--blood);background:linear-gradient(0deg,var(--surface),var(--surface))}
.rq.urgent{border-left-color:#C77800}
.rq .hd{display:flex;gap:12px;align-items:center}
.rq .bags{font:700 1.15rem/1.3 "Noto Serif Bengali",Georgia,serif}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
.critical .pill.bad .dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.critical .pill.bad .dot{animation:none}}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 20px;display:grid;gap:12px}
.msg h2{margin:0}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted)}
.tier{display:flex;flex-wrap:wrap;gap:8px}
.tier .pill{opacity:.55}.tier .pill.on{opacity:1}

/* switch */
.sw{display:flex;align-items:center;gap:12px;min-height:48px;font-weight:500;margin:0;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .k{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw .k::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+.k{background:var(--brand)}.sw input:checked+.k::after{transform:translateX(20px)}
.sw input:focus-visible+.k{outline:3px solid var(--focus);outline-offset:2px}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.tabs button{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.scroll{overflow-x:auto}

/* modal + toast */
.mb{position:fixed;inset:0;z-index:50;background:rgba(8,16,14,.55);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);color:var(--ink);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.mb{align-items:center}.modal{border-radius:20px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;max-width:min(92vw,420px);font-weight:500;line-height:1.5}
@media (min-width:760px){.toast{bottom:32px}}
footer{border-top:1px solid var(--line);padding:24px 0 110px;color:var(--muted);font-size:.9rem}
@media (min-width:760px){footer{padding-bottom:32px}}
footer a{color:var(--muted)}
.tel{font:700 1.3rem/1.4 "Noto Serif Bengali",Georgia,serif}
table{border-collapse:collapse;width:100%;font-size:.92rem}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
</style>
</head>

<script>

function eligible(d){
  if(!d.lastDonation)return{ok:true,days:null,left:0,next:''};
  const gap=d.gender==='female'?120:90;
  const days=Math.floor((Date.now()-new Date(d.lastDonation+'T00:00:00'))/DAY);
  const next=isoDay(new Date(new Date(d.lastDonation+'T00:00:00').getTime()+gap*DAY));
  return{ok:days>=gap,days,left:Math.max(0,gap-days),next};
}

/* auth (prototype: hashing happens in the browser; a real deployment must verify on a server) */
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function hashPw(pw,saltHex){
  if(!(window.crypto&&crypto.subtle))throw new Error('crypto');
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:unhex(saltHex),iterations:150000,hash:'SHA-256'},k,256);
  return hex(new Uint8Array(bits));
}
const newSalt=()=>hex(crypto.getRandomValues(new Uint8Array(16)));
async function makePw(pw){const salt=newSalt();return{salt,hash:await hashPw(pw,salt)}}
async function checkPw(pw,rec){if(!rec)return false;return(await hashPw(pw,rec.salt))===rec.hash}
function rate(key,ms,max){
  const now=Date.now();let a=[];try{a=JSON.parse(store.get('nbc.rl.'+key)||'[]')}catch(e){}
  a=a.filter(t=>now-t<ms);if(a.length>=max)return false;a.push(now);store.set('nbc.rl.'+key,JSON.stringify(a));return true;
}

  <div class="card"><fieldset><legend>${L('রক্তের গ্রুপ','Blood group')}</legend><div class="chips" id="gchips">${GROUPS.map(g=>`<button type="button" class="chip" data-act="gchip" data-g="${g}" aria-pressed="${fs.group===g}">${g}</button>`).join('')}</div></fieldset>
  <div class="two"><div class="field"><label for="f-union">${L('ইউনিয়ন / পৌরসভা','Union / Paurashava')}</label><select id="f-union" data-f="union">${unionOpts(fs.union,L('সব এলাকা','All areas'))}</select></div>
  <div class="field"><label for="f-area">${L('গ্রাম / এলাকা','Village / area')}</label><input type="text" id="f-area" data-f="area" value="${esc(fs.area)}" placeholder="${L('যেমন: ঢালুয়া বাজার','e.g. Dhalua Bazar')}"></div>
  <div class="field"><label for="f-avail">${L('উপলব্ধতা','Availability')}</label><select id="f-avail" data-f="avail"><option value="">${L('সব','Any')}</option><option value="yes"${fs.avail==='yes'?' selected':''}>${L('শুধু উপলব্ধ','Available only')}</option></select></div>
  <div class="field"><label for="f-last">${L('সর্বশেষ রক্তদান','Last donation')}</label><select id="f-last" data-f="last"><option value="">${L('যেকোনো সময়','Any time')}</option><option value="90"${fs.last==='90'?' selected':''}>${L('৩ মাসের বেশি আগে','More than 3 months ago')}</option><option value="180"${fs.last==='180'?' selected':''}>${L('৬ মাসের বেশি আগে','More than 6 months ago')}</option><option value="never"${fs.last==='never'?' selected':''}>${L('এখনও দেননি','Never donated')}</option></select></div></div>
  <button class="btn btn-g btn-s" data-act="fclear" type="button">${L('ফিল্টার মুছুন','Clear filters')}</button></div>
  <p class="muted" id="rcount" role="status" style="margin:14px 0 8px"></p><div class="grid g2" id="results"></div>`;
}
function updateResults(){
  const f=fs;const q=f.area.trim().toLowerCase();
  const list=pub().filter(d=>(!f.group||d.group===f.group)&&(!f.union||d.unionId===f.union)&&(!q||d.village.toLowerCase().includes(q))&&(f.avail!=='yes'||d.available)&&
    (!f.last||(f.last==='never'?!d.lastDonation:(!d.lastDonation||eligible(d).days>=+f.last))))
    .sort((a,b)=>(b.available&&eligible(b).ok)-(a.available&&eligible(a).ok)||b.available-a.available||a.name.localeCompare(b.name,'bn'));
  $('#rcount').textContent=L(N(list.length)+' জন রক্তদাতা পাওয়া গেছে',list.length+' donor(s) found');
  $('#results').innerHTML=list.length?list.map(donorCard).join(''):`<div class="empty" style="grid-column:1/-1">${L('এই শর্তে কোনো দাতা নেই। অন্য এলাকা বা গ্রুপ চেষ্টা করুন, অথবা জরুরি আবেদন করুন।','No donors match. Try another area or group, or post an emergency request.')}<p style="margin-top:12px"><a class="btn btn-d btn-s" href="#/request-new">${L('জরুরি আবেদন করুন','Post an emergency request')}</a></p></div>`;
  document.querySelectorAll('#gchips .chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.g===f.group)));
}

function viewUnions(){

  <div class="grid g2">${db.unions.map(u=>{const ds=ap.filter(d=>d.unionId===u.id);const av=ds.filter(d=>d.available&&eligible(d).ok).length;const em=ds.filter(d=>d.emergencyReady&&d.available&&eligible(d).ok).length;
  return`<article class="card stack"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><h3 style="margin:0">${esc(lang==='bn'?u.bn:u.en)}</h3><span class="pill brand">${u.kind==='paurashava'?L('পৌরসভা','Paurashava'):L('ইউনিয়ন','Union')}</span></div>
  <div class="meta"><span>${L('মোট দাতা','Total')}: <b>${N(ds.length)}</b></span><span>${L('উপলব্ধ','Available')}: <b>${N(av)}</b></span><span>${L('জরুরি দাতা','Emergency')}: <b>${N(em)}</b></span></div>
  <div class="chips">${GROUPS.map(g=>{const c=ds.filter(d=>d.group===g).length;return c?`<a class="pill" style="text-decoration:none" href="#/find?g=${encodeURIComponent(g)}&u=${u.id}"><b style="color:var(--blood)">${g}</b> ${N(c)}</a>`:''}).join('')||`<span class="muted small">${L('এখনও কোনো দাতা নেই','No donors yet')}</span>`}</div>
  <a class="btn btn-o btn-s" href="#/find?u=${u.id}">${L('দাতাদের দেখুন','View donors')}</a></article>`}).join('')}</div>`;
}
function viewProfile(id){
  const d=db.donors.find(x=>x.id===id&&x.status==='approved');
  if(!d)return`<div class="empty">${L('এই প্রোফাইল পাওয়া যায়নি।','This profile was not found.')}<p style="margin-top:12px"><a class="btn btn-p btn-s" href="#/find">${L('দাতা খুঁজুন','Find donors')}</a></p></div>`;
  const nx=TIERS.find(t=>d.donationCount<t[0]);
  return`<article class="card stack"><div class="top2" style="display:flex;gap:16px;align-items:center">${gb(d.group,'lg')}<div><h1 style="margin:0;font-size:1.5rem;font-family:'Hind Siliguri',sans-serif">${esc(d.name)}</h1><div class="meta"><span>${esc(d.village)}, ${esc(uname(d.unionId))}</span></div><div style="margin-top:6px">${availPill(d)}</div></div></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><div><div class="muted small">${L('মোট রক্তদান','Total donations')}</div><b class="tel">${N(d.donationCount)}</b></div><div><div class="muted small">${L('সর্বশেষ রক্তদান','Last donation')}</div><b>${d.lastDonation?fmtDate(d.lastDonation):L('এখনও দেননি','Not yet')}</b></div>${d.emergencyReady?`<div><div class="muted small">${L('জরুরি ডাক','Emergency calls')}</div><b>${L('সাড়া দিতে প্রস্তুত','Ready to respond')}</b></div>`:''}</div>
  <div><p class="lbl">${L('অর্জন','Achievements')}</p><div class="tier">${TIERS.map(t=>`<span class="pill ${d.donationCount>=t[0]?'ok on':''}">${L(t[1],t[2])} · ${N(t[0])}+</span>`).join('')}</div>${nx?`<p class="hint">${L('পরের ব্যাজ: আরও '+N(nx[0]-d.donationCount)+' বার রক্তদান','Next badge: '+(nx[0]-d.donationCount)+' more donation(s)')}</p>`:''}</div>
  <div class="row">${d.showPhone&&d.available?`<a class="btn btn-p" href="tel:${esc(d.phone)}">${L('কল করুন','Call')} ${esc(d.phone)}</a>`:''}<button class="btn ${d.showPhone&&d.available?'btn-o':'btn-p'}" data-act="contact" data-id="${esc(d.id)}" type="button"${d.available?'':' disabled'}>${L('যোগাযোগ করুন','Contact')}</button><button class="btn btn-g" data-act="report" data-id="${esc(d.id)}" type="button">${L('প্রোফাইল রিপোর্ট করুন','Report this profile')}</button></div></article>`;
}

function viewDashboard(){
  const d=me();if(!d)return viewLogin();
  const e=eligible(d);const notes=db.notes.filter(n=>n.donorId===d.id).sort((a,b)=>b.at-a.at);
  const cr=db.contacts.filter(c=>c.donorId===d.id).sort((a,b)=>b.at-a.at);

  const rs=[...db.reports].sort((a,b)=>b.at-a.at);

function render(keep){
  const raw=(location.hash||'#/').slice(1);const [path,qs]=raw.split('?');const parts=path.split('/').filter(Boolean);const key=parts[0]||'home';
  if(key==='find'&&qs){const q=new URLSearchParams(qs);fs={group:q.get('g')||'',union:q.get('u')||'',area:'',avail:'',last:''}}
  const V={home:viewHome,find:viewFind,register:viewRegister,'request-new':viewRequestNew,requests:viewRequests,unions:viewUnions,donor:()=>viewProfile(parts[1]),login:viewLogin,dashboard:viewDashboard,admin:viewAdmin};
  $('#app').innerHTML=(V[key]||viewHome)();

function resizePhoto(file){return new Promise(res=>{
  if(!file||!file.size)return res('');
  if(!/^image\/(jpe?g|png|webp)$/.test(file.type)||file.size>8e6)return res(null);
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=128,c=document.createElement('canvas');c.width=c.height=s;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);res(c.toDataURL('image/jpeg',.72))};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}
const botCheck=(d,ms)=>d.website||Date.now()-(+d._t||0)<ms;
const tooFast=L('একটু অপেক্ষা করে আবার চেষ্টা করুন।','Please wait a moment and try again.');
const FORMS={
  async register(f,d){
    if(botCheck(d,3500))return toast(tooFast);
    const E={};const name=(d.name||'').trim();const phone=normPhone(d.phone);const emc=normPhone(d.emergencyContact);
    if(name.length<3)E.name=L('পূর্ণ নাম লিখুন (কমপক্ষে ৩ অক্ষর)।','Enter your full name (3+ characters).');
    if(!phoneOk(phone))E.phone=L('সঠিক মোবাইল নম্বর দিন, যেমন 01712345678।','Enter a valid mobile number, e.g. 01712345678.');
    if(!GROUPS.includes(d.group))E.group=L('রক্তের গ্রুপ বেছে নিন।','Select a blood group.');
    if(!['male','female'].includes(d.gender))E.gender=L('লিঙ্গ বেছে নিন।','Select gender.');
    if(!d.dob)E.dob=L('জন্ম তারিখ দিন।','Enter your date of birth.');else{const a=ageOf(d.dob);if(a<18||a>60)E.dob=L('রক্তদাতার বয়স ১৮ থেকে ৬০ বছর হতে হবে।','Donor age must be between 18 and 60.')}
    if(!db.unions.some(u=>u.id===d.unionId))E.unionId=L('ইউনিয়ন বেছে নিন।','Select a union.');
    if((d.village||'').trim().length<2)E.village=L('গ্রাম বা এলাকার নাম লিখুন।','Enter your village or area.');
    const cnt=parseInt(asciiDigits(d.donationCount||'0'),10);
    if(!(cnt>=0&&cnt<=200))E.donationCount=L('০ থেকে ২০০ এর মধ্যে সংখ্যা দিন।','Enter a number from 0 to 200.');
    if(d.lastDonation&&d.lastDonation>isoDay(new Date()))E.lastDonation=L('ভবিষ্যতের তারিখ দেওয়া যাবে না।','The date cannot be in the future.');
    else if(d.lastDonation&&cnt===0)E.donationCount=L('সর্বশেষ রক্তদানের তারিখ থাকলে সংখ্যা কমপক্ষে ১ হবে।','If you gave a last donation date, the count must be at least 1.');
    if(d.emergencyContact&&!phoneOk(emc))E.emergencyContact=L('সঠিক নম্বর দিন।','Enter a valid number.');
    else if(d.emergencyContact&&emc===phone)E.emergencyContact=L('নিজের নম্বর দেওয়া যাবে না।','This cannot be your own number.');
    if((d.password||'').length<6)E.password=L('কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড দিন।','Use a password of at least 6 characters.');
    if(!['yes','no'].includes(d.showPhone))E.showPhone=L('নম্বর দেখানো হবে কি না বেছে নিন।','Choose whether to show your number.');
    if(!d.consent)E.consent=L('নিবন্ধনের জন্য সম্মতি প্রয়োজন।','Consent is required to register.');
    if(!showErrors(f,E))return;
    if(!rate('reg',3600e3,3))return toast(L('অল্প সময়ে অনেকবার চেষ্টা হয়েছে। পরে আবার চেষ্টা করুন।','Too many attempts. Try again later.'));
    const photo=await resizePhoto(f.elements.photoFile.files[0]);
    if(photo===null)return showErrors(f,{photoFile:L('ছবি JPG, PNG বা WebP হতে হবে (৮ MB এর কম)।','Photo must be JPG, PNG or WebP under 8 MB.')});
    const email=phone+'@donor.nbc.app';
    const dup=L('এই নম্বর দিয়ে আগেই নিবন্ধন করা হয়েছে। “লগইন” করুন, অথবা আগের পাসওয়ার্ড দিন।','This number is already registered. Please log in, or use your earlier password.');
    try{
      let ok=false;
      try{const j=await SB.signUp(email,d.password);if(j&&j.access_token){SB.setFromAuth(j);ok=true}}catch(e){}
      if(!ok){try{await SB.signIn(email,d.password)}catch(e){if(e.status&&e.status<500)return showErrors(f,{phone:dup});throw e}}
      const own=await SB.rest('donors?select=id&user_id=eq.'+SB.sess.uid);
      if(!own.length){
        await SB.rest('donors',{method:'POST',body:{user_id:SB.sess.uid,name,phone,gender:d.gender,blood_group:d.group,dob:d.dob,union_id:d.unionId,village:d.village.trim(),photo:photo||null,last_donation:d.lastDonation||null,donation_count:cnt,available:!!d.available,emergency_ready:!!d.emergencyReady,show_phone:d.showPhone==='yes',emergency_contact:emc||null}});
      }
      await loadPrivate();rebuild();
    }catch(e){
      if(e&&e.code==='23505')return showErrors(f,{phone:dup});
      throw e;
    }
    toast(L('নিবন্ধন জমা হয়েছে। অ্যাডমিন অনুমোদনের অপেক্ষায়।','Registration submitted. Waiting for admin approval.'));location.hash='#/dashboard';
  },
  async request(f,d){
    if(botCheck(d,3500))return toast(tooFast);
    const E={};const contact=normPhone(d.contact);const bags=parseInt(asciiDigits(d.bags||'0'),10);
    if((d.patient||'').trim().length<2)E.patient=L('রোগীর নাম লিখুন।','Enter the patient name.');
    if(!GROUPS.includes(d.group))E.group=L('রক্তের গ্রুপ বেছে নিন।','Select a blood group.');
    if(!(bags>=1&&bags<=10))E.bags=L('১ থেকে ১০ এর মধ্যে সংখ্যা দিন।','Enter 1 to 10.');
    if((d.hospital||'').trim().length<3)E.hospital=L('হাসপাতালের নাম লিখুন।','Enter the hospital name.');
    if((d.location||'').trim().length<3)E.location=L('হাসপাতালের অবস্থান লিখুন।','Enter the hospital location.');
    if(!d.when||isNaN(new Date(d.when))||new Date(d.when)<Date.now()-2*36e5)E.when=L('সঠিক ভবিষ্যৎ সময় দিন।','Enter a valid upcoming time.');
    if(!phoneOk(contact))E.contact=L('সঠিক মোবাইল নম্বর দিন।','Enter a valid mobile number.');
    if(!d.consent)E.consent=L('সম্মতি প্রয়োজন।','Confirmation is required.');
    if(!showErrors(f,E))return;
    if(!rate('req',3600e3,3))return toast(L('অল্প সময়ে অনেকবার চেষ্টা হয়েছে।','Too many attempts. Try again later.'));
    await SB.rest('blood_requests',{method:'POST',auth:false,body:{patient_name:d.patient.trim(),blood_group:d.group,bags,hospital:d.hospital.trim(),location:d.location.trim(),union_id:db.unions.some(u=>u.id===d.unionId)?d.unionId:null,needed_at:new Date(d.when).toISOString(),contact,level:['critical','urgent','normal'].includes(d.level)?d.level:'urgent',info:(d.info||'').trim().slice(0,300)||null}});
    $('#app').innerHTML=`<div class="card stack center" style="max-width:520px;margin:24px auto"><h1>${L('আবেদন জমা হয়েছে','Request submitted')}</h1><p>${L('অ্যাডমিন যাচাই করে দ্রুত প্রকাশ করবেন এবং মিল থাকা দাতাদের জানানো হবে।','An admin will review it shortly, publish it and notify matching donors.')}</p><div class="row"><a class="btn btn-p" href="#/requests">${L('চলমান আবেদন দেখুন','See active requests')}</a><a class="btn btn-o" href="#/find">${L('নিজে দাতা খুঁজুন','Search donors yourself')}</a></div></div>`;window.scrollTo(0,0);
  },
  async contact(f,d){
    if(botCheck(d,2500))return toast(tooFast);
    const E={};const p=normPhone(d.cphone);if((d.cname||'').trim().length<2)E.cname=L('আপনার নাম লিখুন।','Enter your name.');if(!phoneOk(p))E.cphone=L('সঠিক মোবাইল নম্বর দিন।','Enter a valid mobile number.');
    if(!showErrors(f,E))return;if(!rate('contact',3600e3,5))return toast(L('অল্প সময়ে অনেকগুলো অনুরোধ পাঠানো হয়েছে।','Too many requests sent. Try again later.'));
    if(!db.donors.some(x=>x.id===d.donorId))return closeModal();
    await SB.rest('contact_requests',{method:'POST',auth:false,body:{donor_id:d.donorId,requester_name:d.cname.trim(),requester_phone:p,message:(d.cmsg||'').trim().slice(0,200)||null}});
    closeModal(true);toast(L('অনুরোধ পাঠানো হয়েছে। দাতা দেখে আপনাকে ফোন করবেন।','Request sent. The donor will call you back.'));
  },
  async report(f,d){
    const E={};if(!d.reason)E.reason=L('একটি কারণ বেছে নিন।','Select a reason.');if(!showErrors(f,E))return;
    if(!rate('report',3600e3,5))return toast(L('অল্প সময়ে অনেকগুলো রিপোর্ট পাঠানো হয়েছে।','Too many reports. Try again later.'));
    await SB.rest('reports',{method:'POST',auth:false,body:{donor_id:d.donorId,reason:d.reason.slice(0,80),note:(d.note||'').trim().slice(0,200)||null}});
    closeModal(true);toast(L('রিপোর্ট পাঠানো হয়েছে। ধন্যবাদ।','Report sent. Thank you.'));
  },
  async login(f,d){
    const E={};const p=normPhone(d.phone);if(!phoneOk(p))E.phone=L('সঠিক মোবাইল নম্বর দিন।','Enter a valid mobile number.');if(!d.password)E.password=L('পাসওয়ার্ড লিখুন।','Enter your password.');
    if(!showErrors(f,E))return;if(!rate('login',60e3,5))return toast(L('অনেকবার চেষ্টা হয়েছে। এক মিনিট পরে আবার চেষ্টা করুন।','Too many attempts. Wait a minute.'));
    try{await SB.signIn(p+'@donor.nbc.app',d.password)}catch(e){if(e.status&&e.status<500)return showErrors(f,{password:L('নম্বর বা পাসওয়ার্ড মেলেনি।','Number or password is incorrect.')});throw e}
    await loadPrivate();rebuild();
    if(!me())toast(L('এই নম্বরে কোনো দাতা প্রোফাইল পাওয়া যায়নি।','No donor profile was found for this number.'));
    render();
  },
  async log(f,d){
    const u=me();if(!u)return;const E={};if(!d.ldate||d.ldate>isoDay(new Date()))E.ldate=L('আজ বা আগের তারিখ দিন।','Enter today or an earlier date.');else if(u.history.some(h=>h.date===d.ldate))E.ldate=L('এই তারিখ আগেই যোগ করা আছে।','This date is already logged.');
    if(!showErrors(f,E))return;
    await SB.rest('donations',{method:'POST',body:{donor_id:u.id,donated_on:d.ldate,note:(d.lplace||'').trim().slice(0,80)||null}});
    const last=(!u.lastDonation||d.ldate>u.lastDonation)?d.ldate:u.lastDonation;
    await SB.rest('donors?id=eq.'+encodeURIComponent(u.id),{method:'PATCH',body:{donation_count:Math.min(200,u.donationCount+1),last_donation:last}});
    await loadMine();rebuild();render(true);toast(L('রক্তদান যোগ হয়েছে। ধন্যবাদ!','Donation added. Thank you!'));
  },
  async profile(f,d){
    const u=me();if(!u)return;const E={};const emc=normPhone(d.emergencyContact);
    if((d.name||'').trim().length<3)E.name=L('পূর্ণ নাম লিখুন।','Enter your full name.');if(!db.unions.some(x=>x.id===d.unionId))E.unionId=L('ইউনিয়ন বেছে নিন।','Select a union.');if((d.village||'').trim().length<2)E.village=L('এলাকার নাম লিখুন।','Enter your area.');
    if(d.lastDonation&&d.lastDonation>isoDay(new Date()))E.lastDonation=L('ভবিষ্যতের তারিখ দেওয়া যাবে না।','The date cannot be in the future.');if(d.emergencyContact&&!phoneOk(emc))E.emergencyContact=L('সঠিক নম্বর দিন।','Enter a valid number.');
    if(!showErrors(f,E))return;const photo=await resizePhoto(f.elements.photoFile.files[0]);if(photo===null)return showErrors(f,{photoFile:L('ছবি JPG, PNG বা WebP হতে হবে।','Photo must be JPG, PNG or WebP.')});
    const body={name:d.name.trim(),union_id:d.unionId,village:d.village.trim(),last_donation:d.lastDonation||null,emergency_contact:emc||null};if(photo)body.photo=photo;
    await SB.rest('donors?id=eq.'+encodeURIComponent(u.id),{method:'PATCH',body});
    await loadMine();rebuild();render(true);toast(L('সংরক্ষিত।','Saved.'));
  },
  async 'admin-login'(f,d){
    const E={};const em=(d.email||'').trim();if(!/^\S+@\S+\.\S+$/.test(em))E.email=L('সঠিক ইমেইল দিন।','Enter a valid email.');if(!d.password)E.password=L('পাসওয়ার্ড লিখুন।','Enter your password.');
    if(!showErrors(f,E))return;
    if(!rate('alogin',60e3,5))return toast(L('অনেকবার চেষ্টা হয়েছে। এক মিনিট অপেক্ষা করুন।','Too many attempts. Wait a minute.'));
    try{await SB.signIn(em,d.password)}catch(e){if(e.status&&e.status<500)return showErrors(f,{password:L('ইমেইল বা পাসওয়ার্ড ভুল।','Incorrect email or password.')});throw e}
    await loadPrivate();
    if(!db.adminOk){await SB.signOut();db.mine=null;rebuild();return showErrors(f,{email:L('এই অ্যাকাউন্টটি অ্যাডমিন নয়।','This account is not an admin.')})}
    rebuild();render();
  },
  async 'admin-donor'(f,d){
    const u=db.donors.find(x=>x.id===d.id);if(!u||!isAdmin())return;const E={};const c=parseInt(asciiDigits(d.donationCount||'0'),10);
    if((d.name||'').trim().length<3)E.name=L('নাম লিখুন।','Enter a name.');
    if(!GROUPS.includes(d.group))E.group=L('গ্রুপ বেছে নিন।','Select a group.');if(!(c>=0&&c<=200))E.donationCount=L('০–২০০ দিন।','Enter 0–200.');
    if(!showErrors(f,E))return;
    await SB.rest('donors?id=eq.'+encodeURIComponent(u.id),{method:'PATCH',body:{name:d.name.trim(),blood_group:d.group,union_id:d.unionId,village:(d.village||'').trim(),donation_count:c,last_donation:d.lastDonation||null}});
    await refreshData();closeModal(true);render(true);toast(L('সংরক্ষিত।','Saved.'));
  },
  async 'admin-union'(f,d){
    if(!isAdmin())return;const E={};if((d.bn||'').trim().length<2)E.bn=L('বাংলা নাম লিখুন।','Enter the Bengali name.');if((d.en||'').trim().length<2)E.en=L('ইংরেজি নাম লিখুন।','Enter the English name.');if(!showErrors(f,E))return;
    if(d.id){await SB.rest('unions?id=eq.'+encodeURIComponent(d.id),{method:'PATCH',body:{name_bn:d.bn.trim(),name_en:d.en.trim()}})}
    else{const slug=d.en.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||uid('u');let id=slug;while(db.unions.some(x=>x.id===id))id=slug+'-'+Math.random().toString(36).slice(2,4);
      await SB.rest('unions',{method:'POST',body:{id,name_bn:d.bn.trim(),name_en:d.en.trim(),kind:'union',sort:db.unions.length+1}})}
    await refreshData();closeModal(true);render(true);toast(L('সংরক্ষিত।','Saved.'));
  }
};
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=FORMS[f.dataset.form];if(!h)return;
  const d={};new FormData(f).forEach((v,k)=>{if(typeof v==='string')d[k]=v});f.querySelectorAll('input[type=checkbox]').forEach(c=>d[c.name]=c.checked);
  const btn=f.querySelector('[type=submit]');if(btn)btn.disabled=true;try{await h(f,d)}catch(err){toast(failMsg(err))}finally{if(btn&&btn.isConnected)btn.disabled=false}});

render();refreshData();
})();
</script>
</body>
